<script>
    function openBenefit(evt, benefitId) {
        let tabContent = document.getElementsByClassName("benefit-content-box");
        for (let i = 0; i < tabContent.length; i++) {
            tabContent[i].classList.remove("active-benefit");
        }
        let tabBtns = document.getElementsByClassName("tab-btn");
        for (let i = 0; i < tabBtns.length; i++) {
            tabBtns[i].classList.remove("active-tab");
        }
        document.getElementById(benefitId).classList.add("active-benefit");
        evt.currentTarget.classList.add("active-tab");
    }

    function handleComplaint(event) {
        event.preventDefault();
        const name = document.getElementById('cName').value.trim();
        const phone = document.getElementById('cPhone').value.trim();
        const subject = document.getElementById('cSubject').value;
        const desc = document.getElementById('cDesc').value.trim();
        
        if(!name || !phone || !desc) {
            alert('कृपया सर्व माहिती भरा.');
            return;
        }

        const randomId = 'YPS-2026-' + Math.floor(100 + Math.random() * 900);
        let complaints = JSON.parse(localStorage.getItem('complaints')) || [];
        complaints.push({ id: randomId, name, phone, subject, desc, status: 'प्रक्रियेत (Pending)' });
        localStorage.setItem('complaints', JSON.stringify(complaints));
        
        alert('तक्रार यशस्वीरीत्या नोंदवली गेली! तुमचा Complaint ID आहे: ' + randomId);
        document.getElementById('complaintForm').reset();
        loadAdminData();
    }

    function handleMember(event) {
        event.preventDefault();
        const name = document.getElementById('mName').value.trim();
        const phone = document.getElementById('mPhone').value.trim();
        const address = document.getElementById('mAddress').value.trim();
        
        if(!name || !phone || !address) {
            alert('कृपया सर्व माहिती भरा.');
            return;
        }

        let members = JSON.parse(localStorage.getItem('members')) || [];
        members.push({ name, phone, address });
        localStorage.setItem('members', JSON.stringify(members));
        
        alert('सदस्य म्हणून यशस्वी नोंदणी झाली!');
        document.getElementById('memberForm').reset();
        loadAdminData();
    }

    function trackComplaint(event) {
        event.preventDefault();
        const searchId = document.getElementById('trackIdInput').value.trim();
        let complaints = JSON.parse(localStorage.getItem('complaints')) || [];
        const found = complaints.find(c => c.id === searchId);
        const resultEl = document.getElementById('trackResult');
        if(found) {
            resultEl.innerText = `ID: ${found.id} | स्थिती: ${found.status} | विषय: ${found.subject}`;
        } else {
            resultEl.innerText = 'हा Complaint ID सापडला नाही, कृपया योग्य आयडी तपासा.';
        }
    }

    // ॲडमिन लॉगइनसाठी हे फंक्शन अपडेट केले आहे
    function verifyAdmin() {
        let passBox = document.getElementById('adminPassInput');
        if (passBox && passBox.value === "admin123") {
            document.getElementById('adminLoginBox').style.display = "none";
            document.getElementById('adminContent').style.display = "block";
            loadAdminData();
        } else {
            alert("चुकीचा पासवर्ड! कृपया 'admin123' टाका.");
        }
    }

    function logoutAdmin() {
        document.getElementById('adminPassInput').value = '';
        document.getElementById('adminContent').style.display = "none";
        document.getElementById('adminLoginBox').style.display = "block";
    }

    function loadAdminData() {
        let complaints = JSON.parse(localStorage.getItem('complaints')) || [];
        let cTableBody = document.querySelector('#complaintTable tbody');
        if(cTableBody) {
            cTableBody.innerHTML = '';
            complaints.forEach(c => {
                cTableBody.innerHTML += `<tr><td>${c.id}</td><td>${c.name}</td><td>${c.phone}</td><td>${c.subject}</td><td>${c.desc}</td><td>${c.status}</td></tr>`;
            });
        }

        let members = JSON.parse(localStorage.getItem('members')) || [];
        let mTableBody = document.querySelector('#memberTable tbody');
        if(mTableBody) {
            mTableBody.innerHTML = '';
            members.forEach(m => {
                mTableBody.innerHTML += `<tr><td>${m.name}</td><td>${m.phone}</td><td>${m.address}</td></tr>`;
            });
        }
    }

    window.onload = function() {
        loadAdminData();
    };
</script>
